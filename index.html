<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRIGHT HOME BUILDERS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:#e5e5e5}
.header{background:#0a8a3a;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-bh{font-size:48px;font-weight:900;line-height:0.8;color:#c45a3a;text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff;letter-spacing:-2px}
.logo-bh span{display:inline-block;background:linear-gradient(#d87a5a,#a33d1f);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.logo-bh span::before{content:'';position:absolute}
.logo-text{color:white;font-weight:900;font-size:22px;line-height:1}
.nav{color:white;font-size:11px;opacity:0.9}
.nav span{margin:0 5px}
.banner{background:#b80f1a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.banner h1{color:white;font-size:16px;font-weight:800;line-height:1.2;flex:1;min-width:200px}
.banner p{color:#ffdddd;font-size:9px;margin-top:4px;font-weight:400}
.badge{background:#facc15;color:#000;padding:8px 14px;border-radius:10px;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;line-height:1.1}
.main{background:#e9e9e9;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.card h2{font-size:20px;font-weight:900;color:#2d2d2d;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.info{font-size:13px;color:#333;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.info b{font-weight:700}
.sign{font-family:'Dancing Script',cursive;font-size:24px;margin-top:5px}
.btns{background:#e9e9e9;padding:0 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{border-radius:20px;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px;color:white;text-decoration:none;font-weight:800}
.btn-red{background:#9f0e1a}
.btn-green{background:#0a8a3a}
.btn small{font-size:12px;font-weight:600;display:block}
.btn strong{font-size:16px;display:block}
.footer{background:#0a8a3a;color:white;font-size:9px;padding:8px 15px;display:flex;justify-content:space-between}
@media(max-width:600px){.main,.btns{grid-template-columns:1fr}.banner h1{font-size:14px}.logo-bh{font-size:36px}.logo-text{font-size:18px}}
</style>
</head>
<body>
<div class="header">
<div class="logo">
<div class="logo-bh">BH</div>
<div class="logo-text">BRIGHT HOME<br>BUILDERS</div>
</div>
<div class="nav">Home <span>|</span> About <span>|</span> Services <span>|</span> Contact</div>
</div>

<div class="banner">
<div style="flex:1">
<h1>BRIGHT HOME BUILDERS & BUILDING MATERIAL CONSTRUCTION COMPANY PRIVATE LIMITED</h1>
<p>Your Trusted Partner for Quality Construction Materials & Building Solutions Since 2015</p>
</div>
<div class="badge">⭐ Trusted<br>Since 2015</div>
</div>

<div class="main">
<div class="card">
<h2>🏢 COMPANY INFO</h2>
<div class="info">📍 <span>
